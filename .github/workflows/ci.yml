name: ci

on: [push, pull_request]

# ADK / pydantic stay an optional extra. Core must stay green on
# `pip install -e ".[dev]"`; agent tests run in a second job that installs
# `.[dev,gemini]`. Do not fold google-adk into base dependencies.

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps (poppler)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Doctor (environment self-check)
        run: .venv/bin/python -m invoiceloop doctor
      - name: Self-contained demo (zero API)
        run: .venv/bin/python -m invoiceloop demo --out /tmp/demo-ws
      - name: Product-path tests
        # 研究测试在无语料的 CI 上按设计跳过(corpus_available)。
        # agent 测试需要 pydantic / google-adk,走旁边的 agent job。
        run: .venv/bin/python -m pytest tests/ -q --ignore-glob='tests/test_agents_*.py'

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with Gemini extra
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,gemini]"
      - name: Agent / ADK tests
        run: .venv/bin/python -m pytest tests/test_agents_*.py -q
